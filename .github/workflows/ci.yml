name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test & Typecheck (main package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=verbose

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify main and dashboard versions match
        run: |
          MAIN_VER=$(node -p "require('./package.json').version")
          DASH_VER=$(node -p "require('./packages/dashboard/package.json').version")
          echo "main=$MAIN_VER dashboard=$DASH_VER"
          if [ "$MAIN_VER" != "$DASH_VER" ]; then
            echo "ERROR: version mismatch"
            exit 1
          fi

  dashboard-test:
    name: Test & Typecheck (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck dashboard
        working-directory: packages/dashboard
        run: npx tsc --noEmit

      - name: Test dashboard
        working-directory: packages/dashboard
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, dashboard-test, version-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build main package
        run: npm run build

      - name: Build dashboard
        working-directory: packages/dashboard
        run: npm run build

      - name: Verify dist-server exists
        working-directory: packages/dashboard
        run: |
          if [ ! -f dist-server/index.js ]; then
            echo "ERROR: dist-server/index.js not found"
            exit 1
          fi
          echo "dist-server/index.js exists"
          ls -la dist-server/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            packages/dashboard/dist-client/
            packages/dashboard/dist-server/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test, dashboard-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (main)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit (dashboard)
        working-directory: packages/dashboard
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  perf-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark
        run: |
          if [ -f test/bench/run.sh ]; then
            bash test/bench/run.sh
          elif [ -f test/perf/retrieval.bench.ts ]; then
            npx vitest run test/perf/ --reporter=verbose
          else
            echo "No benchmark suite found, skipping"
          fi
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            test/bench/results/
            test/perf/results/
          retention-days: 30
          if-no-files-found: ignore
